      </text>
      <rect x="82" y="397" width="302" height="1" fill="#22D3EE" opacity=".22">
        <animate attributeName="x" values="82;384;82" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="66" y="445" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="700">
      Data → Models → Impact
    </text>
    <text x="66" y="473" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
      Building practical, data-driven solutions.
    </text>
    <text x="66" y="520" fill="#22D3EE" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">
      ~/profile $ build --learn --ship
    </text>
    <rect x="66" y="535" width="7" height="15" fill="#22D3EE" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Right system panel -->
    <rect x="459" y="90" width="689" height="486" rx="20" fill="#0F172A" fill-opacity=".55" stroke="#22D3EE" stroke-opacity=".18" filter="url(#shadow)"/>
    <text x="493" y="123" fill="#22D3EE" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="2">
      SYSTEM.INFO
    </text>
    <text x="1114" y="123" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" text-anchor="end">
      profile.v1
    </text>

    <text x="493" y="170" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="38" font-weight="700">
      Ramya Joshi
    </text>
    <text x="493" y="201" fill="#22D3EE" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">
      AIML Engineering · Data Science · ML · Data Engineering
    </text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
      <text x="493" y="248" fill="#64748B">ROLE</text>
      <text x="635" y="248" fill="#F8FAFC">AIML Engineering Student</text>

      <text x="493" y="278" fill="#64748B">FOCUS</text>
      <text x="635" y="278" fill="#F8FAFC">Data Science · Machine Learning</text>

      <text x="493" y="308" fill="#64748B">LEARNING</text>
      <text x="635" y="308" fill="#F8FAFC">SQL · Python · Statistics · Data Engineering</text>
    </g>

    <line x1="493" y1="332" x2="1114" y2="332" stroke="#94A3B8" stroke-opacity=".12"/>

    <text x="493" y="361" fill="#22D3EE" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="1.5">
      SELECTED STACK
    </text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">
      <g transform="translate(493 378)">
        <rect width="94" height="30" rx="15" fill="#22D3EE" fill-opacity=".08" stroke="#22D3EE" stroke-opacity=".32"/>
        <circle cx="15" cy="15" r="3" fill="#34D399"/><text x="26" y="19" fill="#D8F7FF">Python</text>
      </g>
      <g transform="translate(595 378)">
        <rect width="76" height="30" rx="15" fill="#7C3AED" fill-opacity=".09" stroke="#7C3AED" stroke-opacity=".32"/>
        <circle cx="15" cy="15" r="3" fill="#34D399"/><text x="26" y="19" fill="#EEE7FF">SQL</text>
      </g>
      <g transform="translate(679 378)">
        <rect width="108" height="30" rx="15" fill="#22D3EE" fill-opacity=".08" stroke="#22D3EE" stroke-opacity=".32"/>
        <circle cx="15" cy="15" r="3" fill="#34D399"/><text x="26" y="19" fill="#D8F7FF">TensorFlow</text>
      </g>
      <g transform="translate(795 378)">
        <rect width="82" height="30" rx="15" fill="#10B981" fill-opacity=".08" stroke="#10B981" stroke-opacity=".32"/>
        <circle cx="15" cy="15" r="3" fill="#34D399"/><text x="26" y="19" fill="#D9FFF1">Pandas</text>
      </g>
      <g transform="translate(885 378)">
        <rect width="88" height="30" rx="15" fill="#7C3AED" fill-opacity=".09" stroke="#7C3AED" stroke-opacity=".32"/>
        <circle cx="15" cy="15" r="3" fill="#34D399"/><text x="26" y="19" fill="#EEE7FF">NumPy</text>
      </g>
      <g transform="translate(981 378)">
        <rect width="97" height="30" rx="15" fill="#22D3EE" fill-opacity=".08" stroke="#22D3EE" stroke-opacity=".32"/>
        <circle cx="15" cy="15" r="3" fill="#34D399"/><text x="26" y="19" fill="#D8F7FF">Streamlit</text>
      </g>
    </g>

    <text x="493" y="442" fill="#22D3EE" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="1.5">
      SELECTED WORK
    </text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">
      <text x="493" y="468" fill="#F8FAFC">SmartDoseAI</text>
      <text x="635" y="468" fill="#94A3B8">AI-based dosage prediction + digital twin simulation</text>
      <text x="493" y="494" fill="#F8FAFC">Product Return Prediction</text>
      <text x="635" y="494" fill="#94A3B8">Predictive analytics pipeline for e-commerce returns</text>
      <text x="493" y="520" fill="#F8FAFC">TravelQA</text>
      <text x="635" y="520" fill="#94A3B8">Information retrieval + knowledge-base question answering</text>
    </g>

    <line x1="493" y1="544" x2="1114" y2="544" stroke="#94A3B8" stroke-opacity=".12"/>
    <text x="493" y="562" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">
      engineering.profile.status
    </text>
    <text x="1114" y="562" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" text-anchor="end">
      READY TO BUILD
    </text>

    <!-- Scanline -->
    <rect x="32" y="90" width="1116" height="2" fill="#22D3EE" opacity=".05">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 484" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
