<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"
     role="img"
     aria-label="Ramya Joshi — AIML Engineering student focused on Data Science, Machine Learning, and Data Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.55" stop-color="#07111F"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="25%" r="75%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".13"/>
      <stop offset=".5" stop-color="#7C3AED" stop-opacity=".07"/>
      <stop offset="1" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.05  0 0 0 0 0.83  0 0 0 0 0.75  0 0 0 .18 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".055"/>
    </pattern>
    <clipPath id="frameClip"><rect x="12" y="12" width="1156" height="586" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1180" height="610" fill="url(#bg)"/>
    <rect width="1180" height="610" fill="url(#glow)"/>
    <rect width="1180" height="610" fill="url(#grid)"/>

    <!-- Ambient particles -->
    <g fill="#22D3EE" opacity=".28">
      <circle cx="74" cy="112" r="1.6"><animate attributeName="cy" values="112;98;112" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="286" cy="548" r="1.3"><animate attributeName="cx" values="286;300;286" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="1034" cy="82" r="1.5"><animate attributeName="cy" values="82;96;82" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="518" r="1.2"><animate attributeName="cx" values="1100;1087;1100" dur="10s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Outer frame -->
    <rect x="12" y="12" width="1156" height="586" rx="24" fill="none" stroke="#22D3EE" stroke-opacity=".25"/>
    <rect x="13" y="13" width="1154" height="584" rx="23" fill="none" stroke="url(#accent)" stroke-opacity=".28">
      <animate attributeName="stroke-opacity" values=".18;.38;.18" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Terminal chrome -->
    <rect x="32" y="30" width="1116" height="42" rx="12" fill="#0F172A" fill-opacity=".78" stroke="#94A3B8" stroke-opacity=".14"/>
    <circle cx="56" cy="51" r="6" fill="#FB7185"/>
    <circle cx="76" cy="51" r="6" fill="#FBBF24"/>
    <circle cx="96" cy="51" r="6" fill="#34D399"/>
    <text x="120" y="56" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
      ramya@profile:~$ ./profile.sh
    </text>
    <text x="1070" y="56" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" text-anchor="end">
      [ ONLINE ]
    </text>

    <!-- Left visual identity panel -->
    <rect x="32" y="90" width="405" height="486" rx="20" fill="#0F172A" fill-opacity=".46" stroke="#22D3EE" stroke-opacity=".18"/>
    <text x="62" y="123" fill="#22D3EE" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="2">
      VISUAL.IDENTITY
    </text>
    <text x="62" y="151" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">
      &gt; render --mode professional
    </text>
    <!-- ASCII portrait generated from supplied profile photo; no raster image embedded -->
    <g transform="translate(0 0)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
       font-size="7.6" letter-spacing="-0.25" fill="#D8F7FF">
      <rect x="65" y="176" width="339" height="238" rx="14"
            fill="#030712" fill-opacity="0.72"
            stroke="#22D3EE" stroke-opacity=".24"/>
      <text x="82" y="190" fill="#22D3EE" font-size="8.5" letter-spacing="1.1">PORTRAIT.MAP</text>
